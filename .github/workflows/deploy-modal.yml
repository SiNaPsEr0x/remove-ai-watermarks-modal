name: Deploy Modal

on:
  push:
    branches:
      - main
    paths:
      - "modal_app.py"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_WEB_URL: https://rocco-spano--remove-ai-watermarks-web-web.modal.run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET missing"; exit 1; }

      - name: Verify Modal runtime secret
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(["modal", "secret", "list", "--json"], text=True)
          )

          def found(value):
              if isinstance(value, str):
                  return value == "raiw-auth"
              if isinstance(value, dict):
                  return any(found(k) or found(v) for k, v in value.items())
              if isinstance(value, list):
                  return any(found(v) for v in value)
              return False

          if not found(data):
              print(
                  "Modal runtime secret 'raiw-auth' is missing. "
                  "Create it with ADMIN_USER, ADMIN_PASSWORD and SESSION_SECRET."
              )
              sys.exit(1)

          print("Modal runtime secret 'raiw-auth' exists.")
          PY

      - name: Deploy to Modal
        run: modal deploy modal_app.py

      - name: Verify deployed web app
        shell: bash
        run: |
          set -u
          for attempt in 1 2; do
            rm -f /tmp/modal-site-body
            status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 10 \
              --output /tmp/modal-site-body \
              --write-out '%{http_code}' \
              "$MODAL_WEB_URL/login" || true)"

            if [ "$status" = "200" ]; then
              echo "Modal web app is healthy: $MODAL_WEB_URL/login (HTTP 200)"
              exit 0
            fi

            echo "Attempt $attempt/2 returned HTTP ${status:-curl-error}."
            if [ -s /tmp/modal-site-body ]; then
              echo "--- response body ---"
              head -c 4000 /tmp/modal-site-body
              echo
              echo "--- end response body ---"
            fi
            sleep 2
          done

          echo "Modal deployment completed, but the public web app is not healthy."
          exit 1

      - name: Show Modal runtime logs
        if: failure()
        shell: bash
        run: |
          echo "Recent Modal runtime logs:"
          modal app logs remove-ai-watermarks-web --since 10m --tail 200 --timestamps || true
