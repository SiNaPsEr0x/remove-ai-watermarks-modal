name: Deploy Modal

on:
  push:
    branches:
      - main
    paths:
      - "modal_app.py"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_CLI_VERSION: "1.5.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore Modal CLI environment
        id: modal-cli-cache
        uses: actions/cache/restore@v6
        with:
          path: .modal-venv
          key: modal-cli-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-modal-${{ env.MODAL_CLI_VERSION }}-r1

      - name: Prepare Modal CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.modal-cli-cache.outputs.cache-hit }}" = "true" ] \
            && [ -x ".modal-venv/bin/modal" ] \
            && .modal-venv/bin/python -c 'import modal' >/dev/null 2>&1; then
            echo "Modal CLI restored from cache; installation skipped."
          else
            echo "Modal CLI cache missing or invalid; installing once."
            rm -rf .modal-venv
            python -m venv .modal-venv
            .modal-venv/bin/python -m pip install \
              --disable-pip-version-check \
              --no-input \
              "modal==$MODAL_CLI_VERSION"
          fi

          echo "$GITHUB_WORKSPACE/.modal-venv/bin" >> "$GITHUB_PATH"
          .modal-venv/bin/modal --version

      - name: Save Modal CLI environment
        if: steps.modal-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .modal-venv
          key: ${{ steps.modal-cli-cache.outputs.cache-primary-key }}

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET missing"; exit 1; }

      - name: Verify Modal runtime secret
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(["modal", "secret", "list", "--json"], text=True)
          )

          def found(value):
              if isinstance(value, str):
                  return value == "raiw-auth"
              if isinstance(value, dict):
                  return any(found(k) or found(v) for k, v in value.items())
              if isinstance(value, list):
                  return any(found(v) for v in value)
              return False

          if not found(data):
              print(
                  "Modal runtime secret 'raiw-auth' is missing. "
                  "Create it with ADMIN_USER, ADMIN_PASSWORD and SESSION_SECRET."
              )
              sys.exit(1)

          print("Modal runtime secret 'raiw-auth' exists.")
          PY

      - name: Deploy to Modal
        shell: bash
        run: |
          set -euo pipefail
          echo "MODAL_LOG_SINCE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

          modal deploy modal_app.py | tee /tmp/modal-deploy.log

          web_url="$(grep -Eo 'https://[a-z0-9.-]+\.modal\.run' /tmp/modal-deploy.log | head -n 1 || true)"
          test -n "$web_url" || { echo "Unable to detect the deployed Modal web URL."; exit 1; }

          echo "MODAL_WEB_URL=$web_url" >> "$GITHUB_ENV"
          echo "Public web URL: $web_url"

      - name: Verify deployed web app
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            rm -f /tmp/modal-site-body
            status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 10 \
              --output /tmp/modal-site-body \
              --write-out '%{http_code}' \
              "$MODAL_WEB_URL/login" || true)"

            if [ "$status" = "200" ]; then
              echo "Modal web app is healthy: $MODAL_WEB_URL/login (HTTP 200)"
              exit 0
            fi

            echo "Attempt $attempt/3 returned HTTP ${status:-curl-error}."
            if [ -s /tmp/modal-site-body ]; then
              echo "--- response body ---"
              head -c 4000 /tmp/modal-site-body
              echo
              echo "--- end response body ---"
            fi
            sleep 2
          done

          echo "Modal deployment completed, but the public web app is not healthy."
          exit 1

      - name: Show Modal runtime logs
        if: failure()
        shell: bash
        run: |
          echo "Modal runtime logs for this deployment only:"
          modal app logs remove-ai-watermarks-web --since "$MODAL_LOG_SINCE" --tail 200 --timestamps || true
