name: Deploy Modal

on:
  push:
    branches:
      - main
    paths:
      - "modal_app.py"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # The Python entry point normalizes this owner/repository pair into the
      # fork-specific Modal app name. Do not hardcode a .modal.run URL.
      MODAL_APP_NAME: ${{ vars.MODAL_APP_NAME || github.repository }}
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT || 'main' }}
      MODAL_CLI_VERSION: "1.5.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore Modal CLI environment
        id: modal-cli-cache
        uses: actions/cache/restore@v6
        with:
          path: .modal-venv
          key: modal-cli-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-modal-${{ env.MODAL_CLI_VERSION }}-r1

      - name: Prepare Modal CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.modal-cli-cache.outputs.cache-hit }}" = "true" ] \
            && [ -x ".modal-venv/bin/modal" ] \
            && .modal-venv/bin/python -c 'import modal' >/dev/null 2>&1; then
            echo "Modal CLI restored from cache; installation skipped."
          else
            echo "Modal CLI cache missing or invalid; installing once."
            rm -rf .modal-venv
            python -m venv .modal-venv
            .modal-venv/bin/python -m pip install \
              --disable-pip-version-check \
              --no-input \
              "modal==$MODAL_CLI_VERSION"
          fi

          echo "$GITHUB_WORKSPACE/.modal-venv/bin" >> "$GITHUB_PATH"
          .modal-venv/bin/modal --version

      - name: Save Modal CLI environment
        if: steps.modal-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .modal-venv
          key: ${{ steps.modal-cli-cache.outputs.cache-primary-key }}

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET missing"; exit 1; }

      - name: Verify Modal runtime secret
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(["modal", "secret", "list", "--json"], text=True)
          )

          def found(value):
              if isinstance(value, str):
                  return value == "raiw-auth"
              if isinstance(value, dict):
                  return any(found(k) or found(v) for k, v in value.items())
              if isinstance(value, list):
                  return any(found(v) for v in value)
              return False

          if not found(data):
              print(
                  "Modal runtime secret 'raiw-auth' is missing. "
                  "Create it with ADMIN_USER, ADMIN_PASSWORD and SESSION_SECRET."
              )
              sys.exit(1)

          print("Modal runtime secret 'raiw-auth' exists.")
          PY

      - name: Deploy to Modal
        shell: bash
        run: |
          set -euo pipefail

          modal_app_name="$(python -c 'from modal_app import APP_NAME; print(APP_NAME)')"
          echo "MODAL_APP_RESOLVED_NAME=$modal_app_name" >> "$GITHUB_ENV"
          echo "Modal app name: $modal_app_name"

          echo "MODAL_LOG_SINCE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

          modal deploy --name "$modal_app_name" --strategy recreate modal_app.py | tee /tmp/modal-deploy.log

          # Modal may wrap a long URL between physical terminal lines.
          # Recombine only the URL candidate so timestamps/tree glyphs cannot
          # make a successful deploy fail the health-check setup.
          web_url="$(python - <<'PY'
          import re
          from pathlib import Path

          raw = Path("/tmp/modal-deploy.log").read_text(encoding="utf-8", errors="replace")
          raw = re.sub(r"\x1b\[[0-9;?]*[ -/]*[@-~]", "", raw)
          match = re.search(r"https://[a-z0-9.-]+\.modal\.r[\s\S]{0,80}?n", raw, re.IGNORECASE)
          if match:
              candidate = re.sub(r"[\s│├└─]+", "", match.group(0))
              if re.fullmatch(r"https://[a-z0-9.-]+\.modal\.run", candidate, re.IGNORECASE):
                  print(candidate)
          PY
          )"
          test -n "$web_url" || { echo "Unable to detect the deployed Modal web URL."; exit 1; }

          echo "MODAL_WEB_URL=$web_url" >> "$GITHUB_ENV"
          echo "Public web URL: $web_url"

      - name: Wait for Modal rollout
        shell: bash
        run: sleep 6

      - name: Verify deployed web app
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            rm -f /tmp/modal-site-body
            status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 10 \
              --output /tmp/modal-site-body \
              --write-out '%{http_code}' \
              "$MODAL_WEB_URL/login" || true)"

            if [ "$status" = "200" ]; then
              echo "Modal web app is healthy: $MODAL_WEB_URL/login (HTTP 200)"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Modal web app not ready yet (HTTP ${status:-curl-error}); retrying."
              sleep 3
              continue
            fi

            echo "Final health check returned HTTP ${status:-curl-error}."
            if [ -s /tmp/modal-site-body ]; then
              echo "--- response body ---"
              head -c 4000 /tmp/modal-site-body
              echo
              echo "--- end response body ---"
            fi
          done

          echo "Modal deployment completed, but the public web app is not healthy."
          exit 1

      - name: Verify exactly one project app
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          name = os.environ["MODAL_APP_RESOLVED_NAME"]
          scope = {name}
          if os.environ["GITHUB_REPOSITORY"] == "SiNaPsEr0x/remove-ai-watermarks-modal":
              scope.add("remove-ai-watermarks-web")
          for attempt in range(20):
              rows = json.loads(subprocess.check_output(["modal", "app", "list", "--json"], text=True))
              active = [r for r in rows if r["description"] in scope and r["state"] != "stopped"]
              if len(active) == 1 and active[0]["description"] == name and active[0]["state"] == "deployed":
                  print("SINGLE_APP_VERIFIED " + json.dumps(active[0]))
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
                      report.write(f"Single deployed project app: {name} ({active[0]['app_id']})\n")
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Expected exactly one deployed project app: " + json.dumps(active))
          PY

      - name: Show Modal runtime logs
        if: failure() && env.MODAL_LOG_SINCE != ''
        shell: bash
        run: |
          echo "Modal runtime logs for this deployment only:"
          modal app logs "$MODAL_APP_RESOLVED_NAME" --since "$MODAL_LOG_SINCE" --tail 200 --timestamps || true
