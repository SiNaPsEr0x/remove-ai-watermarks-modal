name: Deploy Modal

on:
  push:
    branches:
      - main
    paths:
      - "modal_app.py"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade modal

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID missing"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "MODAL_TOKEN_SECRET missing"; exit 1; }

      - name: Deploy to Modal
        run: modal deploy modal_app.py
