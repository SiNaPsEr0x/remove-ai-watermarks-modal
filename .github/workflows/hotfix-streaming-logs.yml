name: Apply worker streaming log hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-streaming-logs.yml
      - scripts/apply_hotfix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply patch
        run: python scripts/apply_hotfix.py

      - name: Validate
        shell: bash
        run: |
          python -m py_compile modal_app.py
          git diff --check
          grep -F '[job] Elaborazione ancora in corso' modal_app.py
          grep -F 'push it to `main`' AGENTS.md

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/hotfix-streaming-logs.yml scripts/apply_hotfix.py
          git add -A
          git commit -m 'fix: stream worker progress during image processing'
          git push origin HEAD:main
